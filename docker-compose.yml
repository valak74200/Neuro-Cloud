version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: nc-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nc-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  diarizer:
    build: ./services/diarizer
    container_name: nc-diarizer
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN}}
      - HF_HOME=/root/.cache/huggingface
      - PYANNOTE_DEVICE=cpu
    ports:
      - "7070:7070"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

volumes:
  pgdata:
  qdrant_storage:
