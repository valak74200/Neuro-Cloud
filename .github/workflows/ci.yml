name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node (for Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit (linters) - first pass
        continue-on-error: true
        run: |
          pre-commit run --all-files
      - name: Commit pre-commit changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply pre-commit formatters"
          file_pattern: .
      - name: Run pre-commit (linters) - verify
        run: |
          pre-commit run --all-files

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      # MinIO is started via a step to avoid service healthcheck issues
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: apps/backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt

      - name: Prepare database (alembic upgrade)
        working-directory: apps/backend
        env:
          NC_OPENAI_API_KEY: ${{ secrets.NC_OPENAI_API_KEY }}
          NC_SUMMARY_LANGUAGE: fr
          NC_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          source .venv/bin/activate
          export PYTHONPATH=.
          alembic upgrade head

      - name: Wait for Qdrant readiness
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:6333/collections >/dev/null && exit 0
            echo "Waiting for Qdrant..."
            sleep 2
          done
          echo "Qdrant not ready" >&2
          exit 1

      - name: Create sample.wav for tests
        working-directory: apps/backend
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import wave, struct, math
          framerate=16000
          secs=1.0
          amp=8000
          freq=440.0
          num=int(framerate*secs)
          with wave.open('sample.wav','wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(framerate)
              for n in range(num):
                  val=int(amp*math.sin(2*math.pi*freq*n/framerate))
                  w.writeframes(struct.pack('<h', val))
          print('sample.wav written')
          PY

      - name: Start Whisper stub (FastAPI)
        working-directory: apps/backend
        run: |
          source .venv/bin/activate
          nohup python - <<'PY' >/dev/null 2>&1 &
          from fastapi import FastAPI, File, UploadFile
          from fastapi.responses import JSONResponse
          import uvicorn
          app = FastAPI()
          @app.post("/transcribe")
          async def transcribe(file: UploadFile = File(...)):
              data = await file.read()
              return JSONResponse({"text": "ok"})
          uvicorn.run(app, host="0.0.0.0", port=8080)
          PY
          sleep 1

      - name: Start Diarization stub (FastAPI)
        working-directory: apps/backend
        run: |
          source .venv/bin/activate
          nohup python - <<'PY' >/dev/null 2>&1 &
          from fastapi import FastAPI, File, UploadFile
          from fastapi.responses import JSONResponse
          import uvicorn
          app = FastAPI()
          @app.post("/diarize")
          async def diarize(file: UploadFile = File(...)):
              return JSONResponse({"segments": [{"start_ms": 0, "end_ms": 500, "speaker": "A"}]})
          uvicorn.run(app, host="0.0.0.0", port=7070)
          PY
          sleep 1

      - name: Start MinIO
        run: |
          docker rm -f ci-minio >/dev/null 2>&1 || true
          docker run -d --name ci-minio \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio12345 \
            -p 9000:9000 -p 9001:9001 \
            minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO readiness
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/ready >/dev/null && exit 0
            echo "Waiting for MinIO..."
            sleep 2
          done
          echo "MinIO not ready" >&2
          exit 1

      - name: Generate live JWT (Supabase)
        run: |
          TOKEN=$(curl -s -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$SUPABASE_TEST_EMAIL\",\"password\":\"$SUPABASE_TEST_PASSWORD\"}" | jq -r .access_token)
          echo "SUPABASE_TEST_JWT=$TOKEN" >> $GITHUB_ENV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

      - name: Run backend tests
        working-directory: apps/backend
        env:
          NC_OPENAI_API_KEY: ${{ secrets.NC_OPENAI_API_KEY }}
          NC_SUMMARY_LANGUAGE: fr
          NC_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          NC_VECTORDB_URL: http://localhost:6333
          NC_S3_ENDPOINT: http://localhost:9000
          NC_S3_ACCESS_KEY_ID: minio
          NC_S3_SECRET_ACCESS_KEY: minio12345
          NC_S3_BUCKET: neuro-cloud
          NC_TEST_AUDIO_FILE: sample.wav
          NC_WHISPER_URL: http://localhost:8080
          NC_WHISPER_PATH: /transcribe
          NC_DIARIZATION_URL: http://localhost:7070
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_TEST_JWT: ${{ secrets.SUPABASE_TEST_JWT }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH=.
          pytest -q --maxfail=1 --disable-warnings --cov=app --junitxml=pytest-report.xml

      - name: Collect passed tests
        id: collect
        working-directory: apps/backend
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse('pytest-report.xml')
          root = tree.getroot()
          passed = set()
          for tc in root.iter('testcase'):
              has_fail = any(child.tag in ('failure', 'error') for child in tc)
              if has_fail:
                  continue
              file_attr = tc.attrib.get('file')
              if file_attr:
                  passed.add(Path(file_attr).name)
                  continue
              classname = tc.attrib.get('classname') or ''
              # pytest classname often like 'tests.test_module'
              mod = classname.split('.')[-1]
              if mod.startswith('test_'):
                  passed.add(mod + '.py') if not mod.endswith('.py') else passed.add(mod)

          out = ','.join(sorted(passed))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"passed={out}\n")
          PY

      - name: Preview roadmap (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/update_progress.py ${{ steps.collect.outputs.passed }} --preview build/ROADMAP.preview.md
          echo "### Aperçu Roadmap (après tests de la PR)" >> $GITHUB_STEP_SUMMARY
          echo "Ces items seraient cochés si mergés dans main/develop." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '\n```' >> $GITHUB_STEP_SUMMARY
          cat build/ROADMAP.preview.md >> $GITHUB_STEP_SUMMARY
          echo '\n```' >> $GITHUB_STEP_SUMMARY

      - name: Update roadmap (on main or develop)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          python3 scripts/update_progress.py ${{ steps.collect.outputs.passed }}

      - name: Commit roadmap update
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update roadmap progress"
          file_pattern: docs/ROADMAP.md
