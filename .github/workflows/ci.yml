name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node (for Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit (linters) - first pass
        continue-on-error: true
        run: |
          pre-commit run --all-files
      - name: Commit pre-commit changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply pre-commit formatters"
          file_pattern: .
      - name: Run pre-commit (linters) - verify
        run: |
          pre-commit run --all-files

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: apps/backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt

      - name: Prepare database (alembic upgrade)
        working-directory: apps/backend
        env:
          NC_OPENAI_API_KEY: ${{ secrets.NC_OPENAI_API_KEY }}
          NC_SUMMARY_LANGUAGE: fr
          NC_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          source .venv/bin/activate
          export PYTHONPATH=.
          alembic upgrade head

      - name: Wait for Qdrant readiness
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:6333/collections >/dev/null && exit 0
            echo "Waiting for Qdrant..."
            sleep 2
          done
          echo "Qdrant not ready" >&2
          exit 1

      - name: Run backend tests
        working-directory: apps/backend
        env:
          NC_OPENAI_API_KEY: ${{ secrets.NC_OPENAI_API_KEY }}
          NC_SUMMARY_LANGUAGE: fr
          NC_PG_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          NC_VECTORDB_URL: http://localhost:6333
        run: |
          source .venv/bin/activate
          export PYTHONPATH=.
          pytest -q --maxfail=1 --disable-warnings --cov=app --junitxml=pytest-report.xml

      - name: Collect passed tests
        id: collect
        working-directory: apps/backend
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse('pytest-report.xml')
          root = tree.getroot()
          passed = set()
          for tc in root.iter('testcase'):
              has_fail = any(child.tag in ('failure', 'error') for child in tc)
              if has_fail:
                  continue
              file_attr = tc.attrib.get('file')
              if file_attr:
                  passed.add(Path(file_attr).name)
                  continue
              classname = tc.attrib.get('classname') or ''
              # pytest classname often like 'tests.test_module'
              mod = classname.split('.')[-1]
              if mod.startswith('test_'):
                  passed.add(mod + '.py') if not mod.endswith('.py') else passed.add(mod)

          out = ','.join(sorted(passed))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"passed={out}\n")
          PY

      - name: Preview roadmap (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/update_progress.py ${{ steps.collect.outputs.passed }} --preview build/ROADMAP.preview.md
          echo "### Aperçu Roadmap (après tests de la PR)" >> $GITHUB_STEP_SUMMARY
          echo "Ces items seraient cochés si mergés dans main/develop." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '\n```' >> $GITHUB_STEP_SUMMARY
          cat build/ROADMAP.preview.md >> $GITHUB_STEP_SUMMARY
          echo '\n```' >> $GITHUB_STEP_SUMMARY

      - name: Update roadmap (on main or develop)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          python3 scripts/update_progress.py ${{ steps.collect.outputs.passed }}

      - name: Commit roadmap update
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update roadmap progress"
          file_pattern: docs/ROADMAP.md
